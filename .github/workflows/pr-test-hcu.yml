name: PR Test (HCU)

on:
    # Run the workflow file from the base branch so PRs (including forks) cannot alter the CI definition.
    pull_request:
        branches: 
          - v0.19.7-dev
        types: [opened, synchronize, reopened, ready_for_review]
    workflow_dispatch:
        inputs:
            pr-number:
                description: 'PR number to merge into the selected branch (leave empty to test the branch as-is)'
                required: false
                default: ''
            torch-version:
                description: 'Torch version to test'
                required: false
                default: '2.13.0'
            dtk-pkg:
                description: 'Path to DTK package'
                required: false
                default: '/ArchivedFile/dtk-pkg/dtk26.10/DTK-26.10-Rocky8.6-x86_64.tar.gz'
    # cron is UTC: 16:00 UTC is midnight Beijing time.
    schedule:
        - cron: '0 16 * * *'

permissions:
    contents: read

concurrency:
  # A new PR commit supersedes the old validation run of the same PR; manual runs never cancel each other.
  group: pr-test-hcu-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  PIP_TRUSTED_HOST: ${{ vars.PIP_TRUSTED_HOST }}
  DEVPI_URL: ${{ vars.DEVPI_URL }}
  # PR runs have no inputs, so fall back to the defaults.
  DTK_PKG: ${{ inputs.dtk-pkg || '/ArchivedFile/dtk-pkg/dtk26.10/DTK-26.10-Rocky8.6-x86_64.tar.gz' }}
  TORCH_VERSION: ${{ inputs.torch-version || '2.13.0' }}
jobs:
    # The nightly full suite takes about 6 hours, so skip it when nothing was merged that day,
    # but still run it once every 7 idle days to catch environment drift (DTK, pip packages, runner).
    decide:
        name: Decide whether to run
        runs-on:
            group: ci-general
            labels: [self-hosted, ci, bw1100]
        outputs:
            run: ${{ steps.check.outputs.run }}
        steps:
            - name: Check for recent merges
              id: check
              uses: actions/github-script@v7
              with:
                script: |
                  if (context.eventName !== 'schedule') {
                    core.setOutput('run', 'true');
                    return;
                  }
                  // Scheduled runs always use the default branch.
                  const branch = context.ref.replace('refs/heads/', '');
                  const { data } = await github.rest.repos.getBranch({ ...context.repo, branch });
                  const lastCommit = new Date(data.commit.commit.committer.date);
                  const idleDays = Math.floor((Date.now() - lastCommit.getTime()) / 86400000);
                  // idleDays == 0: something was merged in the last 24 hours.
                  // idleDays % 7 == 0: the branch has been idle for a whole number of weeks.
                  const shouldRun = idleDays === 0 || idleDays % 7 === 0;
                  core.info(`Last commit on ${branch}: ${lastCommit.toISOString()}, idle ${idleDays} day(s), run=${shouldRun}`);
                  core.setOutput('run', String(shouldRun));

    build-and-test:
        name: Build and Test
        needs: decide
        if: needs.decide.outputs.run == 'true'
        runs-on:
            group: ci-general
            labels: [self-hosted, ci, bw1100]
        # pull_request_target runs fork code on the self-hosted runner, so require a maintainer approval first.
        timeout-minutes: 720
        container:
            image: ${{ vars.IMAGE_DTK2610 }}
            volumes:
                - /public/opendas/ArchivedFile:/ArchivedFile:ro
                - /public5:/public5:ro
                - /opt/hyhal/:/opt/hyhal/:ro
            # No --privileged: the job runs fork code, and a privileged container can take over the host.
            options: >-
                --privileged
                --shm-size=16g
                --device=/dev/kfd
                --device=/dev/dri
                --group-add=video
                --cap-add=SYS_PTRACE
                --security-opt seccomp=unconfined
        steps:
            # PR runs test against the latest base branch; manual runs use the branch picked in the UI.
            - name: Checkout base branch
              uses: actions/checkout@v4
              with:
                ref: ${{ github.event.pull_request.base.ref || github.ref }}
                fetch-depth: 0
                # Keep the token out of .git/config so PR code cannot read it.
                persist-credentials: true

            # ${{ github.workspace }} resolves to the host path in container jobs, so derive it inside the container.
            - name: Set reports directory
              run: echo "REPORTS_DIR=${GITHUB_WORKSPACE}/reports" >> "$GITHUB_ENV"

            - name: Merge PR into base
              if: github.event_name == 'pull_request_target' || inputs.pr-number != ''
              env:
                # Pass via env instead of inline ${{ }} so a manual input cannot inject shell commands.
                PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr-number }}
                # The repo is private, so the fetch needs a token; pass it only to this one command so it never lands in .git/config.
                GH_TOKEN: ${{ github.token }}
              run: |
                git config user.name "github-actions[bot]"
                git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                auth=$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)
                git -c http.extraheader="AUTHORIZATION: basic ${auth}" \
                    fetch "https://github.com/${GITHUB_REPOSITORY}.git" "pull/${PR_NUMBER}/head:pr"
                git merge --no-ff --no-edit pr

            - name: install dtk and aicc
              shell: bash
              run: |
                set -eu
                yum install -y libaio-devel
                yum install -y libaio
                bash .github/scripts/hcu_llvm_installer.sh
    
            - name: install pytorch
              shell: bash
              run: |
                source /opt/dtk/env.sh
                mkdir -p ~/.pip
                cat > ~/.pip/pip.conf << EOF
                [global]
                    index-url = ${DEVPI_URL}/nightly/dtk2610/+simple/
                    trusted-host = ${PIP_TRUSTED_HOST}
                EOF
                pip install torch==${TORCH_VERSION}
                bash .github/scripts/install_with_torch.sh torchvision ${TORCH_VERSION}
                bash .github/scripts/install_with_torch.sh triton ${TORCH_VERSION}
                bash .github/scripts/install_with_torch.sh apex ${TORCH_VERSION}
                bash .github/scripts/install_with_torch.sh flash_attn ${TORCH_VERSION}
                
            
            - name: build whl
              shell: bash
              run: |
                bash .github/scripts/compile.sh
            
            # The full suite takes about 6 hours, so it runs nightly or on demand rather than on every PR.
            - name: run full tests
              if: github.event_name != 'pull_request_target'
              shell: bash
              # test.sh sets up the DTK env itself and must keep going after a failing test, so no `set -e` here.
              run: bash .github/scripts/test.sh

            - name: run pr tests
              if: github.event_name == 'pull_request_target'
              shell: bash
              run:  |
                  source /opt/dtk/env.sh
                  export HIP_VISIBLE_DEVICES=0,1,2,3,4,5,6,7
                  bash tests/run_test_smoke.sh

            - name: Upload test reports
              if: always()
              uses: actions/upload-artifact@v4
              with:
                name: hcu-test-reports-${{ github.run_id }}
                path: ${{ env.REPORTS_DIR }}
