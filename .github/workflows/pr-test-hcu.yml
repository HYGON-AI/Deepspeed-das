name: PR Test (HCU)

on:
    # Run the workflow file from the base branch so PRs (including forks) cannot alter the CI definition.
    pull_request_target:
        branches: [ds-v0.19.2-opensource]
        types: [opened, synchronize, reopened, ready_for_review]
    workflow_dispatch:
        inputs:
            pr-number:
                description: 'PR number to merge into the selected branch (leave empty to test the branch as-is)'
                required: false
                default: ''
            torch-version:
                description: 'Torch version to test'
                required: false
                default: '2.10.0'
            dtk-pkg:
                description: 'Path to DTK package'
                required: false
                default: '/ArchivedFile/dtk-pkg/dtk26.04/DTK-26.04-rc4-centos8-x86_64.tar.gz'

permissions:
    contents: read

concurrency:
  # A new PR commit supersedes the old validation run of the same PR; manual runs never cancel each other.
  group: pr-test-hcu-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  PIP_INDEX_URL: ${{ vars.PIP_INDEX_URL }}
  PIP_TRUSTED_HOST: ${{ vars.PIP_TRUSTED_HOST }}
  DEVPI_URL: ${{ vars.DEVPI_URL }}
  # PR runs have no inputs, so fall back to the defaults.
  DTK_PKG: ${{ inputs.dtk-pkg || '/ArchivedFile/dtk-pkg/dtk26.04/DTK-26.04-rc4-centos8-x86_64.tar.gz' }}
  TORCH_VERSION: ${{ inputs.torch-version || '2.10.0' }}
jobs:
    build-and-test:
        name: Build and Test
        runs-on:
            group: ci-general
            labels: [self-hosted, ci, bw1100]
        # pull_request_target runs fork code on the self-hosted runner, so require a maintainer approval first.
        timeout-minutes: 720
        container:
            image: ${{ vars.IMAGE }}
            volumes:
                - /public/opendas/ArchivedFile:/ArchivedFile:ro
                - /public5:/public5:ro
                - /opt/hyhal/:/opt/hyhal/:ro
            # No --privileged: the job runs fork code, and a privileged container can take over the host.
            options: >-
                --shm-size=16g
                --device=/dev/kfd
                --device=/dev/dri
                --group-add=video
                --cap-add=SYS_PTRACE
                --security-opt seccomp=unconfined
        steps:
            # PR runs test against the latest base branch; manual runs use the branch picked in the UI.
            - name: Checkout base branch
              uses: actions/checkout@v4
              with:
                ref: ${{ github.event.pull_request.base.ref || github.ref }}
                fetch-depth: 0
                # Keep the token out of .git/config so PR code cannot read it.
                persist-credentials: false

            # ${{ github.workspace }} resolves to the host path in container jobs, so derive it inside the container.
            - name: Set reports directory
              run: echo "REPORTS_DIR=${GITHUB_WORKSPACE}/reports" >> "$GITHUB_ENV"

            - name: Merge PR into base
              if: github.event_name == 'pull_request_target' || inputs.pr-number != ''
              env:
                # Pass via env instead of inline ${{ }} so a manual input cannot inject shell commands.
                PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr-number }}
                # The repo is private, so the fetch needs a token; pass it only to this one command so it never lands in .git/config.
                GH_TOKEN: ${{ github.token }}
              run: |
                git config user.name "github-actions[bot]"
                git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                auth=$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)
                git -c http.extraheader="AUTHORIZATION: basic ${auth}" \
                    fetch "https://github.com/${GITHUB_REPOSITORY}.git" "pull/${PR_NUMBER}/head:pr"
                git merge --no-ff --no-edit pr

            - name: install dtk and aicc
              shell: bash
              run: |
                set -eu
                cp -f ${DTK_PKG} /opt/
                cd /opt && tar -xzf $(basename ${DTK_PKG}) && mv dtk-* dtk
                yum install -y libaio-devel
                yum install -y libaio
                src_dir="/ArchivedFile/ai_cc/Nightly"
                latest_run=$(cd "${src_dir}" && find . -maxdepth 1 -type f -name 'dtk_llvm_aicc-1.0.0_*.run' -printf '%f\n' | sed 's/\.run$//' | sort -t '_' -k4 -nr | head -n1)
                if [[ -n "${latest_run}" ]]; then
                    cp "${src_dir}/${latest_run}.run" "${GITHUB_WORKSPACE}/"
                    cd "${GITHUB_WORKSPACE}"
                    chmod +x "${latest_run}.run"
                    printf 'y\n' | bash "${latest_run}.run"
                    echo "AICC installation completed"
                else
                    echo "No AICC installer found; skipping installation"
                fi
            - name: install Python dependencies
              shell: bash
              run: |
                source /opt/dtk/env.sh
                mkdir -p ~/.pip
                cat > ~/.pip/pip.conf << EOF
                [global]
                    index-url = http://10.16.1.201:9929/nightly/dtk2604/+simple/
                    trusted-host = 10.16.1.201
                EOF
                cd "${GITHUB_WORKSPACE}"
                pip install torch==${TORCH_VERSION}
                bash .github/scripts/install_with_torch.sh torchvision ${TORCH_VERSION} 0.25.0
                bash .github/scripts/install_with_torch.sh triton ${TORCH_VERSION} 3.6.0
                bash .github/scripts/install_with_torch.sh apex ${TORCH_VERSION} 1.7.0
                bash .github/scripts/install_with_torch.sh flash_attn ${TORCH_VERSION} 2.8.3
                pip3 install -r  requirements/requirements-autotuning-ml.txt  -i https://pypi.tuna.tsinghua.edu.cn/simple --trusted-host pypi.tuna.tsinghua.edu.cn
                pip3 install -r  requirements/requirements-1bit-mpi.txt  -i https://pypi.tuna.tsinghua.edu.cn/simple --trusted-host pypi.tuna.tsinghua.edu.cn
                pip3 install -r  requirements/requirements-autotuning.txt  -i https://pypi.tuna.tsinghua.edu.cn/simple --trusted-host pypi.tuna.tsinghua.edu.cn
                pip3 install -r  requirements/requirements-inf.txt -i https://pypi.tuna.tsinghua.edu.cn/simple --trusted-host pypi.tuna.tsinghua.edu.cn
                pip3 install -r  requirements/requirements-sd.txt  -i https://pypi.tuna.tsinghua.edu.cn/simple --trusted-host pypi.tuna.tsinghua.edu.cn
                sed -i 's/^numpy$/numpy==1.26.3/' requirements/requirements.txt
                pip install -r requirements/requirements.txt   -i https://pypi.tuna.tsinghua.edu.cn/simple --trusted-host pypi.tuna.tsinghua.edu.cn
                pip install -r requirements/requirements-dev.txt  --no-deps -i https://pypi.tuna.tsinghua.edu.cn/simple --trusted-host pypi.tuna.tsinghua.edu.cn
                bash .github/scripts/requirements.sh
            
            - name: build whl
              shell: bash
              run: |
                set -e
                source /opt/dtk/env.sh
                export BUILD_ROOT=${GITHUB_WORKSPACE}
                export PYTHON_VERSION=$(python --version 2>&1 | awk -F '[ .]' '{print $2 "." $3}')
                export LD_LIBRARY_PATH=/usr/local/lib/python${PYTHON_VERSION}/site-packages/torch/lib:$BUILD_ROOT/third_party/libaio_build/lib:$LD_LIBRARY_PATH
                export LD_LIBRARY_PATH=/usr/local/lib/python${PYTHON_VERSION}/site-packages/torch/lib:$LD_LIBRARY_PATH
                export C_INCLUDE_PATH=$BUILD_ROOT/third_party/libaio_build/include:$C_INCLUDE_PATH
                export C_PLUS_INCLUDE_PATH=$C_INCLUDE_PATH
                export CFLAGS="-I$BUILD_ROOT/third_party/libaio_build/include/ -w"
                export CXXFLAGS="-w"
                export LDFLAGS="-L$BUILD_ROOT/third_party/libaio_build/lib/"
                export HSA_FORCE_FINE_GRAIN_PCIE=1
                export HIP_VISIBLE_DEVICES=0,1,2,3
                export LD_LIBRARY_PATH=/usr/local/lib/python3.10/dist-packages/hcusmi:$LD_LIBRARY_PATH
                python3 --version
                echo ${PYTHON_VERSION}
                echo "obtain the path of the torch"
                TORCH_PATH=$(python -c "import torch, os; print(os.path.dirname(torch.__file__))" 2>/dev/null)
                echo "${TORCH_PATH}"
                export LD_LIBRARY_PATH=${TORCH_PATH}/lib:$LD_LIBRARY_PATH
                echo $LD_LIBRARY_PATH
                export CXX=hipcc
                export CC=hipcc
                DS_BUILD_SPARSE_ATTN=0 DS_BUILD_EVOFORMER_ATTN=0 DS_BUILD_CUTLASS_OPS=0 DS_BUILD_FP_QUANTIZER=0  DS_BUILD_OPS=1  DS_ACCELERATOR='cuda' python3 setup.py install bdist_wheel
                pip install dist/*.whl
            
            - name: run tests
              shell: bash
              # test.sh sets up the DTK env itself and must keep going after a failing test, so no `set -e` here.
              run: bash .github/scripts/test.sh

            - name: Upload test reports
              if: always()
              uses: actions/upload-artifact@v4
              with:
                name: hcu-test-reports-${{ github.run_id }}
                path: ${{ env.REPORTS_DIR }}
